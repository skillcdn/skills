<!doctype html>
<!-- One look: a self-contained page with its tokens at the top, the words the sheet shares, and the rule that
     makes it read at a phone width. Copy it per look and change the tokens and the composition, not the words. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look &lt;n&gt;: &lt;name&gt;</title>
<style>
:root{--bg:#F6F5F1;--ink:#1E2430;--mute:#5B6472;--accent:#1F5C3F;--rule:#D9D6CE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:40px 48px}
h1{font-size:clamp(32px,4.5vw,56px);line-height:1.08;margin:0 0 20px;letter-spacing:-.02em}
p.lead{font-size:19px;line-height:1.5;color:var(--mute);max-width:42ch;margin:0 0 28px}
a.ask{display:inline-block;color:var(--ink);text-decoration:underline;text-underline-offset:4px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
@media (max-width:640px){.wrap{padding:24px 20px}.two{grid-template-columns:1fr;gap:24px}}
</style></head><body><div class="wrap">
<section class="two">
<div><h1>&lt;the headline the sheet shares&gt;</h1><p class="lead">&lt;the one line the sheet shares&gt;</p><a class="ask" href="#">&lt;the ask&gt;</a></div>
<div>&lt;what this look shows here: the material, type alone, a diagram, nothing&gt;</div>
</section>
</div></body></html>
