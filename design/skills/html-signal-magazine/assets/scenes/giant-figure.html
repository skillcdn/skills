<!-- giant-figure: one figure across the slide, the sentence it carries under it, and one value of the same year
     beside it for scale. The sentence is the slide's title: there is no .t on this scene. -->
<style>
.g-fig { left: 84px; top: 250px; font-size: 440px; line-height: 1; color: var(--accent) }
.g-fig small { margin-left: 12px; font-size: 130px; color: var(--ink) }
.g-say { left: 96px; top: 760px; width: 1000px; font-size: 46px; line-height: 1.32; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance }
.g-side { right: 96px; top: 380px; width: 480px; padding: 44px }
.g-side b { display: block; font-size: 84px; line-height: 1.1 }
.g-side span { display: block; margin-top: 12px }
</style>
<section class="slide" data-pattern="giant-figure">
  <div class="hd">Section</div>
  <div class="g-fig num">00<small>%</small></div>

  <div class="g-side card"><b class="num">00%</b><span class="cap">Another value of the same year, for scale</span></div>
