name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that a release of the indexer that reads the pack differently shows without a push.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. CI never needs secrets, so pull requests from forks are safe to run.
permissions:
  contents: read

jobs:
  check:
    name: Validate skills and documents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check.mjs

  index:
    name: The indexer's own check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The released indexer, the code the service reads the pack with. Unpinned on purpose: a pinned one would
      # keep passing after the service had moved on. It reads the checkout and needs no secret.
      - run: npx --yes @skillcdn/cli@latest check
      # The skill tables of the READMEs are written by the same command: a table behind the pack fails here.
      - run: >-
          npx --yes @skillcdn/cli@latest catalog
          --check README.md --check design/README.md --check engineering/README.md
          --check marketing/README.md --check media/README.md --check operations/README.md
          --check product/README.md --check writing/README.md

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner'
